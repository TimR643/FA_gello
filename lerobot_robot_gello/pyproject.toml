[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lerobot_robot_gello"
version = "0.1.0"
description = "LeRobot Bring-Your-Own-Hardware robot plugin for the GELLO/ZMQ Panda stack"
requires-python = ">=3.10"
dependencies = ["gello", "lerobot", "numpy"]

[tool.setuptools.packages.find]
where = ["."]
